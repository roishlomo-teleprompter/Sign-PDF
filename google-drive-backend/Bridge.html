<!doctype html><html><head><meta name="referrer" content="no-referrer"></head><body><script>
'use strict';
const channel='<?!= channel ?>',appOrigin=<?!= JSON.stringify(appOrigin) ?>;
const allowed=new Set(['auth-begin','auth-finish','auth-guest','auth-session','auth-logout','auth-gmail-token','workspace-status','workspace-owner-call','workspace-public-resolve','workspace-public-call','shared-version','shared-create','shared-list','shared-download','shared-cancel','shared-public-read','shared-public-sign','shared-public-result']);
window.addEventListener('message',event=>{
 const m=event.data;if(event.source!==window.top||event.origin!==appOrigin||!m||m.channel!==channel||m.type!=='signway-drive-request'||!allowed.has(m.action)||typeof m.id!=='string')return;
 const respond=result=>window.top.postMessage({type:'signway-drive-result',channel,id:m.id,...result},appOrigin);
 google.script.run.withSuccessHandler(data=>respond({data})).withFailureHandler(e=>respond({error:e.message||'Google request failed'})).googleDispatch(m.accessToken,m.action,m.payload);
});
window.top.postMessage({type:'signway-drive-ready',channel},appOrigin);
</script></body></html>
