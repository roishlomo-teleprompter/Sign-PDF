<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>SignWay - מעבר ל-Google Drive</title><style>body{font:18px system-ui;background:#f2f6fc;color:#163356;margin:0;padding:28px}main{max-width:620px;margin:40px auto;background:white;border-radius:24px;padding:32px;box-shadow:0 10px 40px #19375a12}h1{font-size:28px}button,a{font:inherit}button{background:#1762dc;color:white;border:0;border-radius:12px;padding:14px 22px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}progress{width:100%;height:24px}#message{white-space:pre-wrap;line-height:1.7}a{color:#1762dc}small{display:block;line-height:1.7;color:#52687c}</style></head><body><main><h1>SignWay - מעבר ל-Google Drive</h1><p>הכנת עותק של המסמכים, אנשי הקשר, בקשות החתימה וההגדרות בחשבון Google שלך.</p><small>השלב הזה מכין ובודק את העותק ב-Drive. לאחר מכן יש להשלים את חיבור השמירה אליו. אפשר להמשיך העברה שנעצרה.</small><p id="account"></p><button id="start" disabled>הכנת המעבר</button><progress id="progress" value="0" max="1" hidden></progress><p id="message" role="status" aria-live="polite">בודק חיבור לחשבון...</p><p><a href="./">חזרה לאפליקציה</a></p></main><script src="vendor/supabase.js"></script><script src="shared-drive.js"></script><script src="drive-migration.js"></script><script>
'use strict';
const db=supabase.createClient('https://yybpppkxniizxbeettpp.supabase.co','sb_publishable_VHrjc5o3jYTfJkR0Y9gZHQ_5DebiLY7',{auth:{flowType:'pkce',detectSessionInUrl:true}}),start=document.getElementById('start'),message=document.getElementById('message'),progress=document.getElementById('progress');
function show(s){if(s.total!==undefined){progress.hidden=false;progress.max=s.total||1;progress.value=s.copied||0}if(s.status==='not-started')message.textContent='החשבון מחובר. אפשר להתחיל בהכנת המעבר.';else if(s.status==='staged')message.textContent=`העותק ב-Drive הוכן ונבדק בהצלחה.\n${s.copied} קובצי PDF, ${s.counts.sign_requests} מסמכים, ${s.counts.signature_groups} קבוצות אנשי קשר, ${s.counts.signature_events} בקשות חתימה ו-${s.counts.event_participants} משתתפים.\nהפעלת השמירה ב-Drive עדיין לא הושלמה.`;else message.textContent=`מכין את העותק ב-Drive: ${s.copied||0} מתוך ${s.total||0} קובצי PDF.`;start.textContent=s.status==='copying'?'המשך המעבר':'הכנת המעבר'}
async function init(){try{const {data,error}=await db.auth.getUser();if(error||!data?.user||data.user.is_anonymous)throw Error('נדרשת התחברות לאפליקציה באמצעות Google. התחברו דרך הקישור למטה ולאחר מכן חזרו לעמוד זה.');document.getElementById('account').textContent=data.user.email;show(await DriveMigration.status({db}));start.disabled=false}catch(e){message.textContent=e.message}}
start.onclick=async()=>{start.disabled=true;try{let language;try{language=localStorage.getItem('signway-language')}catch{}show(await DriveMigration.stage({db,language,onProgress:show}))}catch(e){message.textContent='ההעברה נעצרה: '+e.message+'\nאפשר לנסות שוב כדי להמשיך.'}finally{start.disabled=false}};init();
</script></body></html>
