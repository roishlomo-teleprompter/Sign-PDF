<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12372a">
  <title>חתימה על PDF</title>
  <style>
    :root{--ink:#14251e;--muted:#66736d;--brand:#176b4d;--brand2:#0e4c37;--paper:#fff;--bg:#f2f5f2;--line:#d8e0db;--danger:#b3261e}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif;min-height:100vh}
    header{background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;padding:max(20px,env(safe-area-inset-top)) 20px 20px;text-align:center;box-shadow:0 4px 18px #0b34252b}
    header h1{margin:0 0 6px;font-size:clamp(1.45rem,4vw,2rem)} header p{margin:0;opacity:.9;font-size:.95rem}
    main{width:min(1050px,100%);margin:auto;padding:20px 14px 40px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 28px #173b2d12}
    .privacy{display:flex;gap:10px;align-items:center;background:#edf8f2;color:#23523f;border:1px solid #cce8d9;border-radius:12px;padding:10px 12px;margin-bottom:16px;font-size:.9rem}
    .upload{display:block;border:2px dashed #7fa793;border-radius:16px;padding:28px 15px;text-align:center;cursor:pointer;background:#fbfdfb;transition:.2s}.upload:hover,.upload.drag{background:#edf8f2;border-color:var(--brand)}
    .upload input{display:none}.upload strong{display:block;font-size:1.12rem;margin-bottom:7px}.upload span{color:var(--muted);font-size:.9rem}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:16px 0}.toolbar.hidden,.hidden{display:none!important}
    button{border:0;border-radius:11px;padding:11px 16px;font-weight:700;font-size:.95rem;cursor:pointer;background:#e8eeea;color:var(--ink);transition:.15s}button:hover{filter:brightness(.97)}button:disabled{opacity:.45;cursor:not-allowed}
    .primary{background:var(--brand);color:#fff}.download{background:#153e75;color:#fff}.danger{color:var(--danger);background:#fff0ef}.page-info{min-width:110px;text-align:center;font-weight:700}
    .workspace{position:relative;margin:auto;width:max-content;max-width:100%;background:#d7dcd9;padding:10px;border-radius:12px;overflow:auto;box-shadow:inset 0 0 0 1px #c7cfca}
    #pdfCanvas{display:block;background:#fff;max-width:none;box-shadow:0 2px 10px #0002;touch-action:none}.signature-layer{position:absolute;display:none;cursor:move;touch-action:none;border:2px dashed var(--brand);background:#ffffffb8;border-radius:5px}.signature-layer img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
    .hint{text-align:center;color:var(--muted);font-size:.9rem;margin:12px 0 0}.size-control{display:flex;align-items:center;gap:8px}.size-control input{width:130px;accent-color:var(--brand)}
    dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100% - 24px));box-shadow:0 24px 80px #0006}dialog::backdrop{background:#071b1488}.modal{padding:18px}.modal h2{margin:0 0 6px}.modal p{margin:0 0 14px;color:var(--muted);font-size:.92rem}
    #signPad{display:block;width:100%;height:220px;border:1px solid var(--line);border-radius:12px;background:#fff;touch-action:none}.modal-actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:flex-start;margin-top:13px}
    .status{margin-top:12px;text-align:center;min-height:22px;font-size:.92rem;color:var(--muted)}.status.error{color:var(--danger)}
    .app-shell{width:min(960px,calc(100% - 28px));margin:auto;padding:16px 0 40px}.topbar{display:flex;align-items:center;justify-content:space-between;direction:ltr;margin-bottom:14px}.lang-switch{display:flex;background:#fff;border:1px solid #d9e0ec;border-radius:12px;padding:4px;box-shadow:0 2px 6px #12213a17}.lang-switch button{background:transparent;color:#33415c;padding:8px 13px;border-radius:9px;font-weight:500}.lang-switch button.active{background:#1f54dc;color:#fff;font-weight:700}.brand{display:flex;align-items:center;gap:10px;color:#1e55dd;font-weight:700;direction:rtl}.brand-icon{display:grid;place-items:center;width:32px;height:32px;background:#1f54dc;color:white;border-radius:50%;font-size:21px}.intro{display:flex;justify-content:space-between;align-items:end;margin:8px 0 26px}.intro h1{font-size:clamp(1.55rem,3vw,2rem);margin:0;color:#071126}.logout{color:#3f5f9e;text-decoration:underline;font-size:.86rem;cursor:pointer}.upload-card,.signer-card,.documents-card{background:#fff;border:1px solid #dce3ee;border-radius:22px;box-shadow:0 18px 42px #213c7114}.upload-card{padding:28px 30px;margin-bottom:28px}.card-title{font-weight:800;text-align:right;margin-bottom:12px;color:#101827}.upload-row{display:grid;grid-template-columns:175px 1fr;gap:18px;align-items:end;direction:ltr}.upload-row .upload{direction:rtl;min-height:120px;display:flex;flex-direction:column;justify-content:center;border-color:#b9d0ff;background:#f8fbff}.upload-row .upload strong{color:#1546b9}.upload-row .primary-link{height:46px;background:#8ba8f8;color:#fff;border-radius:12px}.upload-row .primary-link:disabled{opacity:1;cursor:not-allowed}.signer-card{padding:18px;margin-bottom:28px}.documents-head{display:flex;align-items:end;justify-content:space-between;margin:0 0 10px}.documents-head h2{margin:0 0 4px;font-size:1.2rem}.documents-head p{margin:0;color:#71809a;font-size:.88rem}.refresh-link{border:0;background:none;color:#1f54dc;padding:0;text-decoration:none}.documents-card{overflow:hidden;border-radius:16px}.empty-docs{text-align:center;padding:30px;color:#7b879b}.doc-row{display:grid;grid-template-columns:1fr auto;align-items:center;padding:15px;border-bottom:1px solid #edf0f5}.doc-row:last-child{border-bottom:0}.doc-name{font-weight:800}.doc-meta{font-size:.78rem;color:#77839a;margin-top:4px}.doc-actions{display:flex;align-items:center;gap:12px}.badge{font-size:.78rem;background:#dff7ed;color:#087757;padding:5px 13px;border-radius:20px}.doc-download{background:#07112a;color:#fff;border-radius:10px;padding:9px 15px}.signer-card .workspace{max-height:70vh}.signer-card .hint{margin-top:14px}
    @media(max-width:600px){.app-shell{width:min(100% - 16px,960px);padding-top:10px}.intro{align-items:center;margin-bottom:16px}.intro h1{font-size:1.45rem}.upload-card{padding:18px 12px;border-radius:16px}.upload-row{grid-template-columns:1fr;direction:rtl}.upload-row .primary-link{order:2}.signer-card{padding:8px}.workspace{padding:6px}.toolbar button{flex:1;min-width:115px}.size-control{width:100%;justify-content:center}.doc-row{grid-template-columns:1fr;gap:12px}.doc-actions{justify-content:space-between}}
  </style>
</head>
<body>
  <main class="app-shell">
    <div class="topbar"><div class="lang-switch"><button id="englishBtn" type="button">English</button><button id="hebrewBtn" class="active" type="button">עברית</button></div><div class="brand"><span class="brand-icon">✓</span><span data-he="חתימה מהירה" data-en="Quick Sign">חתימה מהירה</span></div></div>
    <div class="intro"><a class="logout" data-he="יציאה" data-en="Exit">יציאה</a><h1 data-he="שלום Roi, איזה מסמך שולחים?" data-en="Hello Roi, which document are we sending?">שלום Roi, איזה מסמך שולחים?</h1></div>
    <section class="upload-card" id="uploadCard">
      <div class="card-title" data-he="בחירת קובץ PDF" data-en="Choose a PDF file">בחירת קובץ PDF</div>
      <div class="upload-row"><button class="primary-link" type="button" disabled data-he="יצירת קישור לחתימה" data-en="Create signing link">יצירת קישור לחתימה</button><label class="upload" id="dropZone"><input id="fileInput" type="file" accept="application/pdf,.pdf"><strong data-he="לחץ לבחירת מסמך" data-en="Click to choose a document">לחץ לבחירת מסמך</strong><span data-he="המסמך יהיה זמין רק באמצעות הקישור הייחודי" data-en="The document stays private on your device">המסמך נשאר במכשיר שלך ואינו מועלה לשרת</span></label></div>
    </section>
    <section class="signer-card hidden" id="signerCard">
      <div class="privacy"><span aria-hidden="true">🔒</span><span data-he="המסמך והחתימה נשארים במכשיר שלך ואינם מועלים לשרת." data-en="Your document and signature remain on your device and are never uploaded.">המסמך והחתימה נשארים במכשיר שלך ואינם מועלים לשרת.</span></div>
      <div class="toolbar hidden" id="pageToolbar"><button id="prevBtn" type="button">העמוד הקודם</button><span class="page-info" id="pageInfo">עמוד 1 מתוך 1</span><button id="nextBtn" type="button">העמוד הבא</button></div>
      <div class="workspace hidden" id="workspace"><canvas id="pdfCanvas"></canvas><div class="signature-layer" id="signatureLayer"><img id="signatureImg" alt="החתימה שלך"></div></div>
      <p class="hint hidden" id="hint">צייר חתימה, מקם אותה על המסמך וגרור למיקום המדויק.</p>
      <div class="toolbar hidden" id="actionToolbar"><button class="primary" id="drawBtn" type="button">צייר חתימה</button><div class="size-control hidden" id="sizeControl"><label for="sizeRange">גודל:</label><input id="sizeRange" type="range" min="80" max="320" value="180"></div><button class="danger hidden" id="removeBtn" type="button">הסר חתימה</button><button class="download" id="downloadBtn" type="button" disabled>הורד PDF חתום</button><button id="newBtn" type="button">מסמך חדש</button></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>
    <section><div class="documents-head"><button class="refresh-link" id="refreshBtn" type="button" data-he="רענון" data-en="Refresh">רענון</button><div><h2 data-he="המסמכים שלי" data-en="My documents">המסמכים שלי</h2><p data-he="מעקב והורדת מסמכים שחתמת" data-en="Track and download signed documents">מעקב והורדת מסמכים שחתמת</p></div></div><div class="documents-card" id="documentsList"><div class="empty-docs" data-he="עדיין אין מסמכים חתומים" data-en="No signed documents yet">עדיין אין מסמכים חתומים</div></div></section>
  </main>
  <dialog id="signDialog"><div class="modal"><h2>צייר את החתימה</h2><p>חתום באצבע, בעכבר או בעט דיגיטלי.</p><canvas id="signPad"></canvas><div class="modal-actions"><button class="primary" id="useSignature" type="button">השתמש בחתימה</button><button id="clearPad" type="button">נקה</button><button id="cancelSign" type="button">ביטול</button></div></div></dialog>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    const $=id=>document.getElementById(id), fileInput=$('fileInput'), dropZone=$('dropZone'), workspace=$('workspace'), pdfCanvas=$('pdfCanvas'), ctx=pdfCanvas.getContext('2d');
    const pageToolbar=$('pageToolbar'),actionToolbar=$('actionToolbar'),pageInfo=$('pageInfo'),statusEl=$('status'),signatureLayer=$('signatureLayer'),signatureImg=$('signatureImg');
    let pdfBytes=null,pdfDoc=null,pageNum=1,renderTask=null,renderScale=1.35,signatureData=null,placements={},drag=null,currentFileName='document.pdf',sessionDocs=[];
    function status(msg,error=false){statusEl.textContent=msg;statusEl.className='status'+(error?' error':'')}
    async function openPdf(file){
      if(!file||file.type!=='application/pdf'){status('יש לבחור קובץ PDF תקין.',true);return}
      try{status('טוען את המסמך...');currentFileName=file.name||'document.pdf';pdfBytes=new Uint8Array(await file.arrayBuffer());pdfDoc=await pdfjsLib.getDocument({data:pdfBytes.slice()}).promise;pageNum=1;placements={};signatureData=null;$('signerCard').classList.remove('hidden');pageToolbar.classList.remove('hidden');workspace.classList.remove('hidden');actionToolbar.classList.remove('hidden');$('hint').classList.remove('hidden');$('sizeControl').classList.add('hidden');$('removeBtn').classList.add('hidden');$('downloadBtn').disabled=true;await renderPage();status('המסמך מוכן לחתימה.');$('signerCard').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){console.error(e);status('לא ניתן לפתוח את המסמך. ייתכן שהוא מוגן או פגום.',true)}}
    async function renderPage(){
      if(renderTask)try{renderTask.cancel()}catch(e){}
      const page=await pdfDoc.getPage(pageNum), viewport=page.getViewport({scale:renderScale});pdfCanvas.width=viewport.width;pdfCanvas.height=viewport.height;
      renderTask=page.render({canvasContext:ctx,viewport});await renderTask.promise;renderTask=null;pageInfo.textContent=`עמוד ${pageNum} מתוך ${pdfDoc.numPages}`;$('prevBtn').disabled=pageNum<=1;$('nextBtn').disabled=pageNum>=pdfDoc.numPages;showPlacement();
    }
    function showPlacement(){const p=placements[pageNum];if(!p||!signatureData){signatureLayer.style.display='none';$('removeBtn').classList.add('hidden');return}signatureImg.src=signatureData;signatureLayer.style.display='block';signatureLayer.style.left=(10+p.x)+'px';signatureLayer.style.top=(10+p.y)+'px';signatureLayer.style.width=p.w+'px';signatureLayer.style.height=p.h+'px';$('removeBtn').classList.remove('hidden')}
    function createPlacement(){const w=+$('sizeRange').value,h=Math.max(45,w*.36);placements[pageNum]={x:Math.max(0,(pdfCanvas.width-w)/2),y:Math.max(0,(pdfCanvas.height-h)/2),w,h,canvasW:pdfCanvas.width,canvasH:pdfCanvas.height};showPlacement();$('sizeControl').classList.remove('hidden');$('downloadBtn').disabled=false}
    fileInput.addEventListener('change',e=>openPdf(e.target.files[0]));
    ['dragenter','dragover'].forEach(t=>dropZone.addEventListener(t,e=>{e.preventDefault();dropZone.classList.add('drag')}));['dragleave','drop'].forEach(t=>dropZone.addEventListener(t,e=>{e.preventDefault();dropZone.classList.remove('drag')}));dropZone.addEventListener('drop',e=>openPdf(e.dataTransfer.files[0]));
    $('prevBtn').onclick=async()=>{if(pageNum>1){saveVisiblePlacement();pageNum--;await renderPage()}};$('nextBtn').onclick=async()=>{if(pageNum<pdfDoc.numPages){saveVisiblePlacement();pageNum++;await renderPage()}};
    const signDialog=$('signDialog'),signPad=$('signPad'),sctx=signPad.getContext('2d');let drawing=false,hasInk=false;
    function resizePad(){const rect=signPad.getBoundingClientRect(),ratio=devicePixelRatio||1;signPad.width=rect.width*ratio;signPad.height=rect.height*ratio;sctx.setTransform(ratio,0,0,ratio,0,0);sctx.lineWidth=3;sctx.lineCap='round';sctx.lineJoin='round';sctx.strokeStyle='#10251d'}
    function pos(e){const r=signPad.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}
    function startDraw(e){e.preventDefault();drawing=true;hasInk=true;const p=pos(e);sctx.beginPath();sctx.moveTo(p.x,p.y)}function moveDraw(e){if(!drawing)return;e.preventDefault();const p=pos(e);sctx.lineTo(p.x,p.y);sctx.stroke()}function endDraw(){drawing=false}
    ['pointerdown'].forEach(t=>signPad.addEventListener(t,startDraw));signPad.addEventListener('pointermove',moveDraw);window.addEventListener('pointerup',endDraw);
    $('drawBtn').onclick=()=>{signDialog.showModal();setTimeout(()=>{resizePad();sctx.clearRect(0,0,signPad.width,signPad.height);hasInk=false},30)};$('clearPad').onclick=()=>{sctx.clearRect(0,0,signPad.width,signPad.height);hasInk=false};$('cancelSign').onclick=()=>signDialog.close();
    $('useSignature').onclick=()=>{if(!hasInk){status('יש לצייר חתימה לפני האישור.',true);return}signatureData=signPad.toDataURL('image/png');signDialog.close();createPlacement();status('אפשר לגרור את החתימה ולשנות את גודלה.')};
    $('sizeRange').oninput=()=>{const p=placements[pageNum];if(!p)return;const center=p.x+p.w/2;p.w=+$('sizeRange').value;p.h=Math.max(45,p.w*.36);p.x=Math.min(pdfCanvas.width-p.w,Math.max(0,center-p.w/2));showPlacement()};
    function saveVisiblePlacement(){const p=placements[pageNum];if(!p||signatureLayer.style.display==='none')return;p.x=parseFloat(signatureLayer.style.left)-10;p.y=parseFloat(signatureLayer.style.top)-10}
    signatureLayer.addEventListener('pointerdown',e=>{e.preventDefault();signatureLayer.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,left:parseFloat(signatureLayer.style.left),top:parseFloat(signatureLayer.style.top)}});
    signatureLayer.addEventListener('pointermove',e=>{if(!drag)return;const p=placements[pageNum],left=Math.min(10+pdfCanvas.width-p.w,Math.max(10,drag.left+e.clientX-drag.x)),top=Math.min(10+pdfCanvas.height-p.h,Math.max(10,drag.top+e.clientY-drag.y));signatureLayer.style.left=left+'px';signatureLayer.style.top=top+'px'});signatureLayer.addEventListener('pointerup',()=>{saveVisiblePlacement();drag=null});
    $('removeBtn').onclick=()=>{delete placements[pageNum];showPlacement();$('downloadBtn').disabled=Object.keys(placements).length===0;status('החתימה הוסרה מהעמוד.')};
    $('newBtn').onclick=()=>location.reload();
    $('downloadBtn').onclick=async()=>{try{saveVisiblePlacement();status('יוצר את הקובץ החתום...');const doc=await PDFLib.PDFDocument.load(pdfBytes.slice()),png=await doc.embedPng(signatureData),pages=doc.getPages();for(const [n,p] of Object.entries(placements)){const page=pages[+n-1],sx=page.getWidth()/p.canvasW,sy=page.getHeight()/p.canvasH;page.drawImage(png,{x:p.x*sx,y:page.getHeight()-(p.y+p.h)*sy,width:p.w*sx,height:p.h*sy})}const out=await doc.save(),blob=new Blob([out],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a'),signedName=currentFileName.replace(/\.pdf$/i,'')+'-חתום.pdf';a.href=url;a.download=signedName;a.click();sessionDocs.unshift({name:signedName,url,time:new Date()});renderDocuments();status('הקובץ החתום הורד בהצלחה.')}catch(e){console.error(e);status('אירעה שגיאה ביצירת הקובץ החתום.',true)}};
    function renderDocuments(){const list=$('documentsList');if(!sessionDocs.length){list.innerHTML='<div class="empty-docs">עדיין אין מסמכים חתומים</div>';return}list.innerHTML=sessionDocs.map((d,i)=>`<div class="doc-row"><div><div class="doc-name">${escapeHtml(d.name)}</div><div class="doc-meta">נוצר ${d.time.toLocaleDateString('he-IL')} בשעה ${d.time.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="doc-actions"><span class="badge">נחתם</span><a class="doc-download" href="${d.url}" download="${escapeHtml(d.name)}">הורדה</a></div></div>`).join('')}
    function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function setLanguage(lang){document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';document.querySelectorAll('[data-he]').forEach(el=>el.textContent=el.dataset[lang]);$('hebrewBtn').classList.toggle('active',lang==='he');$('englishBtn').classList.toggle('active',lang==='en')}
    $('hebrewBtn').onclick=()=>setLanguage('he');$('englishBtn').onclick=()=>setLanguage('en');$('refreshBtn').onclick=renderDocuments;document.querySelector('.logout').onclick=()=>location.reload();
  </script>
</body>
</html>
