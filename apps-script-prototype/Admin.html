<!doctype html><html lang="he" dir="rtl"><head><base target="_top"><style>body{font:15px Arial;padding:14px;color:#172b4e}button,input{width:100%;box-sizing:border-box;margin:10px 0;padding:12px}button{background:#2054dc;color:white;border:0;border-radius:10px}p{line-height:1.6;overflow-wrap:anywhere}textarea{width:100%;height:100px}</style></head><body><h2>SignWay</h2><p>פיילוט פרטי: העלאת PDF עד 5MB ויצירת קישור לחתימה.</p><input id="file" type="file" accept="application/pdf,.pdf"><button id="upload">העלאה ויצירת קישור</button><p id="status" role="status"></p><textarea id="link" readonly hidden aria-label="קישור לחתימה"></textarea><script>
const adminToken='<?!= adminToken ?>';
document.getElementById('upload').onclick=async()=>{const button=document.getElementById('upload'),status=document.getElementById('status'),file=document.getElementById('file').files[0];if(!file||file.size>5*1024*1024){status.textContent='בחרו PDF עד 5MB';return}button.disabled=true;document.getElementById('link').hidden=true;status.textContent='שומר בדרייב...';try{const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});google.script.run.withSuccessHandler(result=>{button.disabled=false;status.textContent='נשמר. העתיקו ושלחו את הקישור במייל או בוואטסאפ. תוקף: 7 ימים.';const link=document.getElementById('link');link.hidden=false;link.value=result.url;link.select()}).withFailureHandler(e=>{button.disabled=false;status.textContent=e.message}).ownerUpload(adminToken,file.name,data)}catch(e){button.disabled=false;status.textContent='לא ניתן לקרוא את הקובץ.'}};
</script></body></html>
