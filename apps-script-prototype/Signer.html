<!doctype html><html lang="he" dir="rtl"><head><base target="_top"><meta name="referrer" content="no-referrer"><style>
*{box-sizing:border-box}body{font:16px Arial;margin:0;background:#f3f6fb;color:#172b4e}main{max-width:900px;margin:auto;padding:16px}h1{font-size:22px}button{border:0;border-radius:10px;padding:12px;background:#e4ebf7;color:#17386e;margin:4px;min-height:44px}button.primary{background:#2054dc;color:white}button:disabled{opacity:.4}#viewport{position:relative;direction:ltr;overflow:hidden;background:white;max-width:100%}#pdf{display:block;width:100%;height:auto}#mark{position:absolute;border:2px dashed #087b62;width:25%;height:8%;pointer-events:none;display:none;object-fit:contain}#ink{border:1px solid #ccd8ec;border-radius:12px;touch-action:none;background:white;width:100%;height:140px}#status{line-height:1.7}nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:center}#tools[hidden],#work[hidden]{display:none}</style>
<script src="https://cdn.jsdelivr.net/gh/roishlomo-teleprompter/Sign-PDF@c75955e36e5e7f799e2c8051447ae6672184015d/vendor/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/gh/roishlomo-teleprompter/Sign-PDF@c75955e36e5e7f799e2c8051447ae6672184015d/vendor/pdf-lib.min.js"></script></head><body><main><h1>SignWay · חתימה בדרך</h1><p id="title"></p><p id="status" role="status">טוען מסמך...</p><section id="work" hidden><nav><button id="prev">הקודם</button><span id="page"></span><button id="next">הבא</button></nav><div id="viewport"><canvas id="pdf"></canvas><img id="mark" alt="מיקום החתימה"></div><section id="tools"><p>ציירו חתימה, ואז הקישו במסמך במקום הרצוי.</p><canvas id="ink" width="640" height="200"></canvas><button id="clear">ניקוי</button><button id="send" class="primary" disabled>אישור ושליחת המסמך החתום</button></section></section></main><script>
const $=id=>document.getElementById(id);let token,bytes,doc,page=1,placement=null,ink=false,drawing=false,busy=false,pendingSubmission=null;
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/gh/roishlomo-teleprompter/Sign-PDF@c75955e36e5e7f799e2c8051447ae6672184015d/vendor/pdf.worker.min.js';
const rpc=(name,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
function showError(e){$('status').textContent=e.message||'אירעה שגיאה';}
async function render(){const p=await doc.getPage(page),view=p.getViewport({scale:1.4});$('pdf').width=view.width;$('pdf').height=view.height;await p.render({canvasContext:$('pdf').getContext('2d'),viewport:view}).promise;$('page').textContent=page+' / '+doc.numPages;$('prev').disabled=page===1;$('next').disabled=page===doc.numPages;mark()}
function mark(){const visible=placement&&placement.page===page&&ink;$('mark').style.display=visible?'block':'none';if(visible){$('mark').src=$('ink').toDataURL();$('mark').style.left=placement.x*100+'%';$('mark').style.top=placement.y*100+'%'}$('send').disabled=!ink||!placement||busy}
const ctx=$('ink').getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#10254b';
function point(e){const r=$('ink').getBoundingClientRect();return [(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*200/r.height]}
$('ink').onpointerdown=e=>{if(busy||pendingSubmission)return;drawing=true;$('ink').setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e))};$('ink').onpointermove=e=>{if(!drawing)return;ctx.lineTo(...point(e));ctx.stroke();ink=true;mark()};$('ink').onpointerup=()=>{drawing=false};$('ink').onpointercancel=()=>{drawing=false};
$('clear').onclick=()=>{if(busy||pendingSubmission)return;ctx.clearRect(0,0,640,200);ink=false;mark()};
$('viewport').onclick=e=>{if(busy||pendingSubmission)return;const r=$('pdf').getBoundingClientRect();placement={page,x:Math.min(.75,Math.max(0,(e.clientX-r.left)/r.width)),y:Math.min(.92,Math.max(0,(e.clientY-r.top)/r.height))};mark()};
$('prev').onclick=async()=>{if(page>1){page--;try{await render()}catch(e){showError(e)}}};$('next').onclick=async()=>{if(page<doc.numPages){page++;try{await render()}catch(e){showError(e)}}};
$('send').onclick=async()=>{if(busy||!placement||!ink)return;busy=true;mark();$('status').textContent='שומר את המסמך החתום...';try{
 if(!pendingSubmission){const pdf=await PDFLib.PDFDocument.load(bytes.slice()),image=await pdf.embedPng($('ink').toDataURL()),p=pdf.getPages()[placement.page-1],w=p.getWidth(),h=p.getHeight();p.drawImage(image,{x:placement.x*w,y:(1-placement.y-.08)*h,width:.25*w,height:.08*h});const saved=await pdf.save();let binary='';for(let i=0;i<saved.length;i+=8192)binary+=String.fromCharCode(...saved.subarray(i,i+8192));pendingSubmission=btoa(binary)}
 const result=await rpc('submitSignedDocument',token,pendingSubmission);if(!result.completed)throw Error('לא התקבל אישור שמירה.');$('status').textContent='המסמך נחתם ונשמר בהצלחה. אפשר לסגור את החלון.';$('work').hidden=true;
 }catch(e){showError(e);$('status').textContent+=' אפשר ללחוץ שוב על אישור כדי לבדוק ולהשלים את אותה שליחה.'}finally{busy=false;mark()}};
google.script.url.getLocation(async location=>{try{token=new URLSearchParams(location.hash.replace(/^#/,'')).get('token');const data=await rpc('getSigningDocument',token);if(data.completed){$('status').textContent='המסמך כבר נחתם.';return}$('title').textContent=data.title;bytes=Uint8Array.from(atob(data.base64),c=>c.charCodeAt(0));doc=await pdfjsLib.getDocument({data:bytes.slice()}).promise;$('work').hidden=false;await render();$('status').textContent=''}catch(e){showError(e)}});
</script></body></html>
